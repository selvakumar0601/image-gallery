<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                alt="Beautiful mountain landscape"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                alt="Beautiful beach and ocean"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                alt="Green forest"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                alt="Mountain lake"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                alt="Lake surrounded by mountains"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
                alt="Mountain valley landscape"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
                alt="Nature landscape"
            >
        </div>

        <div class="gallery-item">
            <img
                src="https://images.unsplash.com/photo-1511497584788-876760111969"
                alt="Forest trees"
            >
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="closeBtn">&times;</button>

        <img id="lightboxImage" src="" alt="Large preview">

    </div>

    <script src="script.js"></script>

</body>
</html>
